<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Members',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Directory</span><h1>Members</h1><p>View and maintain registered members.</p></div><a class="btn btn-primary" th:href="@{/members/register}">+ Register member</a></div><section class="panel"><form class="search" th:action="@{/members}" method="get"><input name="q" th:value="${query}" placeholder="Search by ID or name"><button class="btn btn-secondary">Search</button><a th:if="${query}" th:href="@{/members}" class="btn btn-ghost">Clear</a></form><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th><th>Actions</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(members)}"><td colspan="6" class="empty">No members found. <a th:href="@{/members/register}">Register the first member.</a></td></tr><tr th:each="m:${members}"><td th:text="${m.id}"></td><td class="strong" th:text="${m.name}"></td><td th:text="${m.email}"></td><td th:text="${m.phone}"></td><td th:text="${m.registrationDate}"></td><td class="actions"><a th:href="@{/members/{id}/edit(id=${m.id})}">Edit</a><form th:action="@{/members/{id}/delete(id=${m.id})}" method="post"><button class="link-danger" onclick="return confirm('Delete this member?')">Delete</button></form></td></tr></tbody></table></div></section></body></html>
