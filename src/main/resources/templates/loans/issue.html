<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Issue Book',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Lending</span><h1>Issue a book</h1><p>Issue available stock for a maximum of 14 days.</p></div></div><section class="panel form-panel"><form th:action="@{/loans/issue}" method="post" th:if="${!#lists.isEmpty(books) and !#lists.isEmpty(members)}"><div class="form-grid"><label>Member *<select name="memberId" required><option value="" selected disabled>Select member</option><option th:each="m:${members}" th:value="${m.id}" th:text="${m.name+' ('+m.id+')'}"></option></select></label><label>Available book *<select name="bookId" required><option value="" selected disabled>Select book</option><option th:each="b:${books}" th:value="${b.id}" th:text="${b.title+' — '+b.author}"></option></select></label><label>Issue date *<input id="issueDate" name="issueDate" type="date" th:value="${issueDate}" required></label><label>Due date<input id="dueDate" type="date" th:value="${dueDate}" readonly></label></div><div class="form-actions"><button class="btn btn-primary">Issue book</button></div></form><div class="empty" th:if="${#lists.isEmpty(books) or #lists.isEmpty(members)}" th:text="${#lists.isEmpty(members)?'Register at least one member before issuing a book.':'There are no available books.'}"></div></section></body></html>
