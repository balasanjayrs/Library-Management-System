<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Return Book',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Lending</span><h1>Active loans</h1><p>Record a return to assess any applicable fine.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Loan</th><th>Member</th><th>Book</th><th>Issued</th><th>Due</th><th>Return</th><th></th></tr></thead><tbody><tr th:if="${#lists.isEmpty(loans)}"><td colspan="7" class="empty">There are no active loans.</td></tr><tr th:each="l:${loans}"><td th:text="${l.id}"></td><td th:text="${l.member.name}"></td><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td><form th:action="@{/loans/{id}/return(id=${l.id})}" method="post" class="inline-form"><input name="returnDate" type="date" th:value="${returnDate}" required><button class="btn btn-primary btn-small">Return</button></form></td><td></td></tr></tbody></table></div></section></body></html>
