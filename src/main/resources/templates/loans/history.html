<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Loan History',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Records</span><h1>Loan History</h1><p>Complete issue and return records.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Loan</th><th>Member</th><th>Book</th><th>Issue date</th><th>Due date</th><th>Return date</th><th>Status</th><th>Fine</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(loans)}"><td colspan="8" class="empty">No loan records are available.</td></tr><tr th:each="l:${loans}"><td th:text="${l.id}"></td><td th:text="${l.member.name}"></td><td th:text="${l.book.title}"></td><td th:text="${l.issueDate}"></td><td th:text="${l.dueDate}"></td><td th:text="${l.returnDate}?:'—'"></td><td><span class="badge" th:classappend="${l.status.name()== 'ACTIVE'}?'issued':'available'" th:text="${l.status}"></span></td><td th:text="${l.status.name()== 'ACTIVE'}?'—':'₹'+${l.fineAmount}"></td></tr></tbody></table></div></section></body></html>
