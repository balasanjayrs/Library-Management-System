<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Overdue Books',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Attention required</span><h1>Overdue Books</h1><p>Active loans whose due dates have passed.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Loan</th><th>Member</th><th>Book</th><th>Due date</th><th>Days overdue</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(loans)}"><td colspan="5" class="empty">No overdue loans. All borrowers are within their due dates.</td></tr><tr th:each="l:${loans}"><td th:text="${l.id}"></td><td th:text="${l.member.name}"></td><td th:text="${l.book.title}"></td><td th:text="${l.dueDate}"></td><td><span class="badge overdue" th:text="${overdueDays.overdueDays(l)+' days'}"></span></td></tr></tbody></table></div></section></body></html>
