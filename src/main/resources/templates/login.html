<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | College Library</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><main class="login-card"><div class="brand brand-large"><span>CL</span><div><strong>College Library</strong><small>Administration portal</small></div></div><h1>Welcome back</h1><p>Sign in to manage library records.</p><div th:if="${param.error}" class="alert danger">Invalid username or password.</div><div th:if="${param.logout}" class="alert success">You have been signed out.</div><form th:action="@{/login}" method="post"><label>Username<input name="username" required autofocus autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">Sign in</button></form></main></body></html>
