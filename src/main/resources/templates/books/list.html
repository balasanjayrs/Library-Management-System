<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Books',~{::body})}"><body><div class="page-heading"><div><span class="eyebrow">Catalogue</span><h1>Books</h1><p>Search, add, edit and manage the collection.</p></div><a class="btn btn-primary" th:href="@{/books/add}">+ Add book</a></div><section class="panel"><form class="search" th:action="@{/books}" method="get"><input name="q" th:value="${query}" placeholder="Search by ID, title or author"><button class="btn btn-secondary">Search</button><a th:if="${query}" th:href="@{/books}" class="btn btn-ghost">Clear</a></form><div class="table-wrap"><table><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="empty">No books found. <a th:href="@{/books/add}">Add the first book.</a></td></tr><tr th:each="b:${books}"><td th:text="${b.id}"></td><td class="strong" th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.category}"></td><td th:text="${b.isbn}"></td><td><span class="badge" th:classappend="${b.availabilityStatus.name()=='AVAILABLE'}?'available':'issued'" th:text="${b.availabilityStatus}"></span></td><td class="actions"><a th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a><form th:action="@{/books/{id}/delete(id=${b.id})}" method="post"><button class="link-danger" onclick="return confirm('Delete this book?')">Delete</button></form></td></tr></tbody></table></div></section></body></html>
