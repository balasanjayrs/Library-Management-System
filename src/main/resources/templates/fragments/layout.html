<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title,content)"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}+' | College Library'">Library</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><div class="brand"><span>CL</span><strong>College Library</strong></div><nav><a th:classappend="${activePage=='dashboard'}?'active'" th:href="@{/}">Dashboard</a><a th:classappend="${activePage=='books'}?'active'" th:href="@{/books}">Books</a><a th:classappend="${activePage=='members'}?'active'" th:href="@{/members}">Members</a><a th:classappend="${activePage=='issue'}?'active'" th:href="@{/loans/issue}">Issue Book</a><a th:classappend="${activePage=='return'}?'active'" th:href="@{/loans/return}">Return Book</a><a th:classappend="${activePage=='history'}?'active'" th:href="@{/loans/history}">Loan History</a><a th:classappend="${activePage=='overdue'}?'active'" th:href="@{/loans/overdue}">Overdue Books</a><a th:classappend="${activePage=='about'}?'active'" th:href="@{/about}">About Project</a></nav></aside><div class="shell"><header class="topbar"><span class="eyebrow">Library Management System</span><div class="account"><span sec:authentication="name"></span><form th:action="@{/logout}" method="post"><button class="btn btn-ghost" type="submit">Logout</button></form></div></header><main><div class="alerts"><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert danger" th:text="${error}"></div></div><th:block th:replace="${content}"/></main></div><script th:src="@{/js/app.js}"></script></body></html>
